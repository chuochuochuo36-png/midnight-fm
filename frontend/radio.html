<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EFEA">
<title>深夜电台</title>
<script>
/* 字体兜底：先走下面 fonts.googleapis.cn 那两行（国内快）。它出错，或者页面加载完等字体就绪（最多 2.5 秒）
   还没有一个 Noto Serif SC 的字加载好，就换 fonts.googleapis.com 同一串再要一次（只补一次）。都拿不到就用 --serif 里的系统宋体。
   不用 document.fonts.check('900 1em "Noto Serif SC"') 判断：样式表整个没下来的时候一个 @font-face 都没有，它照样回 true；
   下来了它又按字算，页面上没用到的那几组字没加载，会回 false。所以看「有没有一个 Noto Serif SC 的字真的加载好了」。 */
var midnightFontFallback = (function () {
  var done = false;
  return function () {
    if (done) return;
    var cn = document.querySelector('link[href*="fonts.googleapis.cn/css2"]');
    if (!cn) return;
    done = true;
    ['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].forEach(function (h) {
      var pc = document.createElement('link'); pc.rel = 'preconnect'; pc.href = h; pc.crossOrigin = 'anonymous'; document.head.appendChild(pc);
    });
    var st = document.createElement('link'); st.rel = 'stylesheet'; st.href = cn.href.replace('fonts.googleapis.cn', 'fonts.googleapis.com');
    /* .com 那份到了：把 .cn 那条拿掉（.cn 的字体文件要是没下来，浏览器记着「失败」，不会自己改用后来补的同名字体），
       再照页面上的字把三种字重要一遍，要到了页面就换上 */
    st.onload = function () {
      if (cn.parentNode) cn.parentNode.removeChild(cn);
      var txt = ((document.body && document.body.innerText) || '').slice(0, 4000) || '深夜电台';
      [500, 700, 900].forEach(function (w) { document.fonts.load(w + ' 1em "Noto Serif SC"', txt).catch(function () {}); });
    };
    document.head.appendChild(st);
  };
})();
window.addEventListener('load', function () {
  if (!document.fonts || !document.fonts.ready) return;
  Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
    var ok = false;
    document.fonts.forEach(function (f) { if (/Noto Serif SC/.test(f.family) && f.status === 'loaded') ok = true; });
    if (!ok) midnightFontFallback();
  });
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.cn">
<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@500;700;900&family=Inter:wght@300;500;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" onerror="midnightFontFallback()">
<style>
/* 深夜电台（2026-10-17）—— 小样定稿是 radio-tape.html（磁带）。红 + 白 + 黑；一个台一盒磁带，左右滑换；夜话台关灯，枕話更暗。
   这一页只管放：每一段话是后端 /api/radio/turn 做好的（他在 radio_<台> 那个会话里说的），念好的音频、拆好的歌和音效都在里面。 */
:root{
  --red:#D0271D; --red-lt:#E8493D;
  --paper:#F2EFEA; --ink:#171412; --ink2:#6F6860; --ink3:#A8A097; --line:rgba(23,20,18,.12);
  --dev:#FCFBF8; --dev2:#ECE8E1; --dots:#D4CEC5; --sheet:#FBFAF7;
  --serif:'Noto Serif SC','Noto Serif CJK SC','Source Han Serif SC','Source Han Serif CN','Songti SC','STSong','SimSun',serif;
  --sans:'Inter',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --t:900ms cubic-bezier(.4,0,.2,1);
}
:root[data-night]{
  --red:#E5392C; --red-lt:#F2574A;
  --paper:#0F0C0B; --ink:#F1E9DC; --ink2:#A3988B; --ink3:#6B615A; --line:rgba(241,233,220,.13);
  --dev:#1D1817; --dev2:#141010; --dots:#3A302D; --sheet:#1A1413;
}
:root[data-night][data-deep]{
  --red:#FF4B3E; --red-lt:#FF6A5E; --paper:#140708; --line:rgba(255,190,180,.13);
  --dev:#1E1213; --dev2:#120A0A; --dots:#3A2223; --sheet:#1C0E0F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body,.mast *,.notes,.notes *,.bar,.bar *{transition:background-color var(--t),color var(--t),border-color var(--t),fill var(--t),stroke var(--t)}
.wrap{max-width:420px;margin:0 auto;padding:14px 20px 130px;min-height:100vh;touch-action:pan-y;user-select:none;-webkit-user-select:none}

/* 顶上：台名是主角 */
.micro{display:flex;justify-content:space-between;align-items:center;font:500 7.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink3)}
.micro .back{border:none;background:none;color:var(--ink2);font:500 20px/1 var(--serif);padding:4px 10px 4px 0;cursor:pointer;margin-right:2px}
.micro .l{display:flex;align-items:center}
.micro .air{color:var(--red);transition:opacity .3s}
.micro .air.off{opacity:.3}
.micro .air::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:0;animation:blink 2.4s infinite}
.title{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px}
.swap{animation:swapR .55s cubic-bezier(.2,.75,.2,1)}
.swap.l{animation-name:swapL}
.side{display:flex;align-items:center;gap:8px;font:800 7.5px/1 var(--sans);letter-spacing:.34em;color:var(--red);margin-bottom:12px}
.side::after{content:"";width:22px;height:1px;background:var(--red)}
.name{font:900 62px/.88 var(--serif);color:var(--red);letter-spacing:.02em;transition:opacity .25s}
.name.dim{opacity:.18}
.tr{text-align:right;padding-bottom:3px}
.freq{font:300 36px/1 var(--sans);color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.freq small{font:500 7.5px var(--mono);color:var(--ink3);margin-left:5px;letter-spacing:.12em}
.en{font:800 7.5px/1 var(--sans);letter-spacing:.32em;color:var(--ink2);margin-top:9px}
.desc{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.desc span{font:500 12.5px/1.5 var(--serif);color:var(--ink2)}
.desc a{font:700 10.5px/1 var(--serif);color:var(--red);cursor:pointer;white-space:nowrap;margin-left:12px}
.tuner{margin-top:14px}
.tuner svg{display:block;width:100%;overflow:visible}
.tun-t{stroke:var(--ink3)}
.tun-l{font:500 8.5px var(--serif);fill:var(--ink3);cursor:pointer}
.tun-l.on{fill:var(--red);font-weight:700}
.tun-e{font:500 6px var(--mono);fill:var(--ink3)}

/* 卡座 */
.hero{display:block;width:100%;margin-top:4px;overflow:visible}
.hero .dev{fill:var(--dev)}
.hero .dev2{fill:var(--dev2)}
.hero .dot{fill:var(--dots)}
.hero .red{fill:var(--red)}
.hero .mt{fill:var(--ink3);font:500 6.4px var(--mono);letter-spacing:.12em}
.hero .btn{cursor:pointer}
.hero .btn:active{opacity:.85}
.hero *{transition:fill var(--t)}
#mic{cursor:pointer;touch-action:none}
#bPlay.wait .ring{animation:pulse 1.6s infinite}

/* 碟带下面：这一晚的单子 */
.notes{margin-top:12px;border-top:1px solid var(--line);padding-top:16px;min-height:200px}
.nrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nlab{font:800 8px/1.4 var(--sans);letter-spacing:.24em;color:var(--red)}
.nnext{font:500 8.5px/1.4 var(--mono);color:var(--ink3);letter-spacing:.06em;text-align:right}
.nnext.busy span{animation:blink 1.6s infinite}
.now{margin-top:12px;font:700 18px/1.75 var(--serif);color:var(--ink);min-height:62px;white-space:pre-line}
.now .song{font:900 28px/1.2 var(--serif);display:block;white-space:normal}
.now .art{display:block;font:800 11px/1 var(--sans);color:var(--red);letter-spacing:.16em;margin:8px 0 12px}
.now .skip{display:inline-block;font:700 10.5px/1 var(--serif);color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:2px;cursor:pointer}
.now .idle{font:500 13px/1.9 var(--serif);color:var(--ink3)}
/* SEG:RADIO v10 —— 滚动歌词：歌名歌手缩成一行，下面一个窗，当前这句大字，前后几句淡，跟着歌往上滚 */
.now .songline{display:block;font:800 11px/1.5 var(--sans);color:var(--red);letter-spacing:.12em;margin:2px 0 8px;white-space:normal}
.now .songline b{font:900 14px/1.5 var(--serif);color:var(--ink);letter-spacing:.04em;margin-right:8px}
.now .songline .skip{margin-left:10px;letter-spacing:0}
.now .pure{display:inline-block;font:700 10px/1 var(--sans);color:var(--ink3);letter-spacing:.2em;border:1px solid var(--line);padding:3px 6px;margin:0 0 12px}
.now .lyr{position:relative;height:176px;overflow:hidden;white-space:normal;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 70%,transparent)}
.now .lyr .in{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.now .lyr p{margin:0;padding:5px 0;font:600 15px/1.45 var(--serif);color:var(--ink3);transition:color .4s}
.now .lyr p.on{font:900 21px/1.4 var(--serif);color:var(--ink)}
.now .lyr p i{display:block;font:500 11.5px/1.5 var(--sans);font-style:normal;color:var(--ink3);margin-top:1px}
.now .lyr p.on i{color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.now .lyr .in{transition:none}}
.w{opacity:.18;transition:opacity .35s}.w.on{opacity:1}
.list{list-style:none;margin-top:18px;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:24px 22px 1fr auto;gap:6px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.list .n{font:500 8.5px var(--mono);color:var(--ink3)}
.list .k{font:700 10px var(--serif);color:var(--ink3)}
.list .x{font:500 12.5px/1.7 var(--serif);color:var(--ink2);white-space:pre-line;word-break:break-word}
.list .d{font:500 8.5px var(--mono);color:var(--ink3)}
.list li.her .k{color:var(--red)}
.list li.her .x{color:var(--ink)}
/* SEG:RADIO v12 —— 放不了的那首：记号红，后面一个去网易云的口子 */
.list li.nos .k{color:var(--red)}
.list .x a.jump{display:inline-block;margin-left:6px;color:var(--red);font:700 11px/1.7 var(--serif);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
/* SEG:RADIO v15 —— 字幕：有真时间的那句，字可以点（跳到那个字念的地方）；回放的单子 */
.now .rv.timed .w{cursor:pointer}
.desc .acts{display:flex;align-items:baseline;white-space:nowrap}
.rp ol{list-style:none;margin-top:4px;border-top:1px solid var(--line)}
.rp li{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rp li b{font:700 13px/1.4 var(--serif);color:var(--ink)}
.rp li i{font:500 9px/1.4 var(--mono);color:var(--ink3);font-style:normal;text-align:right}
.rp li span{grid-column:1/-1;font:500 11.5px/1.6 var(--serif);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .live{display:inline-block;margin:2px 0 12px;font:700 11.5px/1 var(--serif);color:var(--red);cursor:pointer;border-bottom:1px solid currentColor}
.rp .none{font:500 12px/1.8 var(--serif);color:var(--ink3);padding:10px 0}
/* SEG:RADIO v16 —— 回放单起一个小标签：合着的时候右边只露一枚红的「回放」；拉开是一屉，四个台像书边上的索引标签，从抽屉左边探出来 */
.rptab,.rpd .sts button{writing-mode:vertical-rl;letter-spacing:.32em;font:700 14px/1 var(--serif);color:#fff;background:var(--red);border:0;border-radius:9px 0 0 9px;padding:11px 7px 9px;cursor:pointer;box-shadow:-2px 2px 8px rgba(0,0,0,.14)}
.rptab{position:fixed;right:0;top:132px;z-index:6}
.rptab.hide{opacity:0;pointer-events:none}
.rpd{position:fixed;top:0;right:0;bottom:0;width:min(360px,82vw);background:var(--sheet);z-index:10;transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.75,.2,1);display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.12)}
.rpd.on{transform:none}
.rpd .hd{display:flex;justify-content:space-between;align-items:baseline;padding:22px 18px 12px;border-bottom:1px solid var(--line)}
.rpd .hd h4{font:900 20px/1.2 var(--serif);color:var(--red)}
.rpd .hd .x{font:500 20px/1 var(--serif);color:var(--ink2);cursor:pointer;padding:0 0 0 12px}
.rpd .bd{flex:1;display:flex;flex-direction:column;min-height:0}
.rpd .sts{position:absolute;left:0;top:112px;transform:translateX(-100%);display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.rpd .sts button{background:color-mix(in srgb,var(--red) 52%,var(--sheet));box-shadow:-1px 1px 4px rgba(0,0,0,.08);transition:background .2s,padding .2s}
.rpd .sts button.on{background:var(--red);padding-right:13px;box-shadow:-2px 2px 8px rgba(0,0,0,.16)}
.rpd .rp{overflow-y:auto;padding:4px 18px 30px}
.rpd .rp ol{border-top:0}
.rpd .rp li{grid-template-columns:1fr;gap:4px}
.rpd .rp li b{font:700 14px/1.45 var(--serif)}
.rpd .rp li i{text-align:left;font:500 9.5px/1.5 var(--mono)}
.rpd .rp .live{margin-top:12px}
.list li.todo .x{color:var(--ink3)}
.list li.cur .x{color:var(--red);font-weight:700}
.err{margin-top:12px;font:500 11px/1.6 var(--serif);color:var(--red)}
.bgmBtn{border:1px solid var(--line);background:none;color:var(--ink3);font:500 9px/1 var(--mono);letter-spacing:.12em;padding:5px 8px;cursor:pointer;margin-left:8px;white-space:nowrap}
.bgmBtn.on{color:var(--red);border-color:var(--red)}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl .bgmBtn{margin-left:0}
.ask{margin-top:14px;padding:16px;border:1px solid var(--red);font:500 13px/1.7 var(--serif);color:var(--ink)}
.ask .row{display:flex;gap:10px;margin-top:12px}
.ask button{flex:1;border:1px solid var(--red);background:none;color:var(--red);font:700 12.5px/1 var(--serif);padding:11px;cursor:pointer;letter-spacing:.2em}
.ask button.go{background:var(--red);color:#fff}

/* 枕話：点单、左右耳、藏起来的字 */
.ord h6{font:800 8px/1 var(--sans);letter-spacing:.24em;color:var(--red);margin:18px 0 9px}
.ord h6:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;color:var(--ink2);font:500 12.5px/1 var(--serif);padding:8px 13px;cursor:pointer;letter-spacing:.06em}
.chip.on{border-color:var(--red);color:var(--red);font-weight:700}
.ord .scene{width:100%;margin-top:10px;border:none;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;font:500 13px var(--serif);color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.ord .scene::placeholder{color:var(--ink3)}
.ord .go{width:100%;margin-top:22px;border:none;background:var(--red);color:#fff;font:700 13px/1 var(--serif);padding:14px;letter-spacing:.24em;cursor:pointer}
.ord .phones{font:500 11px/1.6 var(--serif);color:var(--ink3);text-align:center;margin-top:10px}
.earline{display:flex;align-items:center;gap:10px;margin-top:14px;font:500 8px/1 var(--mono);color:var(--ink3);letter-spacing:.1em}
.earline .rail{flex:1;height:1px;background:var(--line);position:relative}
.earline .rail i{position:absolute;top:-4.5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--red);transition:left .9s cubic-bezier(.4,0,.2,1),transform .9s,opacity .9s}
.earline .where{font:700 10.5px/1 var(--serif);color:var(--red);min-width:40px;text-align:right;letter-spacing:.06em}
.hid{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border:1px dashed var(--line);font:500 12px/1.6 var(--serif);color:var(--ink3)}
.hid button,.byeBtn{border:1px solid var(--red);background:none;color:var(--red);font:700 11px/1 var(--serif);padding:7px 11px;cursor:pointer;white-space:nowrap}
.byeBtn{margin-top:14px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.bar .in{max-width:420px;margin:0 auto;padding:10px 20px 14px}
.hint{font:500 9.5px/1.3 var(--sans);color:var(--ink3);letter-spacing:.06em;margin-bottom:9px}
.hint b{color:var(--red)}
.bar form{display:flex;gap:10px}
.bar input{flex:1;border:none;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;font:500 13px var(--serif);color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.bar input::placeholder{color:var(--ink3)}
.bar form button{border:none;background:var(--red);color:#fff;font:700 12px/1 var(--serif);padding:0 14px;letter-spacing:.2em;cursor:pointer}
.bar form button.alt{background:none;color:var(--red);border:1px solid var(--red);letter-spacing:.1em}
.bar form button{white-space:nowrap;flex:none}
@media (max-width:340px){.bar form{gap:6px}.bar form button{padding:0 10px;letter-spacing:.06em}}

.veil{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:var(--sheet);z-index:10;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.75,.2,1)}
.sheet.on{transform:none}
.sheet .in{max-width:420px;margin:0 auto;padding:22px 22px 36px}
.sheet h4{font:900 22px/1.2 var(--serif);color:var(--red)}
.sheet .sb{font:500 10px/1.6 var(--sans);color:var(--ink3);margin:6px 0 14px}
.sheet h5{font:800 8px/1 var(--sans);letter-spacing:.24em;color:var(--red);margin:18px 0 8px}
.sheet li{font:500 12.5px/1.95 var(--serif);color:var(--ink)}
.sheet ul{padding-left:16px}
.sheet .x{float:right;font:500 20px/1 var(--serif);color:var(--ink2);cursor:pointer;padding:0 0 8px 12px}
.sheet .foot{margin-top:18px;font:500 10.5px/1.7 var(--serif);color:var(--ink3)}
.sheet code{font:500 10px var(--mono)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 12px/1.5 var(--serif);padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;max-width:80vw;text-align:center}
.toast.on{opacity:.92}

@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.7}}
@keyframes swapR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes swapL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header class="mast">
    <div class="micro"><span class="l"><button class="back" id="back" title="回去" aria-label="回去">‹</button>MIDNIGHT FM · 深夜电台</span><span class="air off" id="air">ON AIR</span></div>
    <div class="title" id="title">
      <div>
        <div class="side" id="side">SIDE C</div>
        <div class="name" id="name">音樂</div>
      </div>
      <div class="tr">
        <div class="freq"><span id="freq">104.1</span><small>MHz</small></div>
        <div class="en" id="en">MUSIC BOX</div>
      </div>
    </div>
    <div class="desc"><span id="desc">他挑的歌，中间说两句。</span><a id="rule">这个台的规矩 →</a></div>
    <div class="tuner"><svg id="tun" viewBox="0 0 350 32" aria-hidden="true"></svg></div>
  </header>

  <svg class="hero" id="hero" viewBox="0 0 350 392" aria-label="卡座：左右滑换台，中间的红键播放，按住红色长键说话">
    <defs>
      <clipPath id="cWell"><rect x="18" y="30" width="314" height="216" rx="18"/></clipPath>
      <linearGradient id="gWellTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>

/* 字幕对字 —— 把 ElevenLabs 那串时间对到屏幕上的字：
   · 那串是它真念的字，带 [whispers] 这种语气标签（不念、也不显示）—— 方括号里的整段跳过；
   · 只拿「发音的字」（汉字、假名、字母、数字）对，标点、空格、换行不发音，跟着前一个字亮；
   · 屏幕上的字按顺序在那串里往后找（最多往后看 6 个，碰上转写过的一两个字也能接上），一句里对不上的超过一成就整句不用，照旧按分量估。
   回一个数组：屏幕上每个 .w（按码位、换行不算）从第几秒开始亮。 */
const capVoiced = c => /[\p{L}\p{N}]/u.test(c);
function capCues(show, raw) {
  if (!raw || !Array.isArray(raw.characters)) return null;
  const st = raw.character_start_times_seconds || [];
  const heard = []; let inTag = false;
  raw.characters.forEach((c, i) => {
    if (c === '[') { inTag = true; return; }
    if (inTag) { if (c === ']') inTag = false; return; }
    const t = Number(st[i]);
    if (capVoiced(c) && isFinite(t)) heard.push({ c: c.normalize('NFKC').toLowerCase(), t });
  });
  if (!heard.length) return null;
  const out = []; let j = 0, at = heard[0].t, voiced = 0, miss = 0;
  for (const ch of show) {
    if (ch === '\n') continue;
    if (capVoiced(ch)) {
      voiced++;
      const want = ch.normalize('NFKC').toLowerCase();
      let k = j;
      while (k < heard.length && k - j < 6 && heard[k].c !== want) k++;
      if (k < heard.length && heard[k].c === want) { at = Math.max(at, heard[k].t); j = k + 1; }
      else miss++;
    }
    out.push(at);
  }
  return voiced && miss <= voiced * 0.1 ? out : null;
}
var capTimes = null, capFor = null, capLastT = null;   /* capTimes：当前这句每个 .w（跟 revealSpans 一一对应）从第几秒开始念 */
function capBind(part) {
  capTimes = null; capFor = part; capLastT = null;
  if (!part || !part.align) return;
  capFetch(part.align).then(raw => {
    if (capFor !== part) return;
    const t = capCues(part.show || part.text || '', raw);
    if (!t) return;
    capTimes = t;
    capMark();
    if (capLastT != null) revealAt(progress, capLastT);
  });
}
function capOk() { return !!(capTimes && revealSpans && capTimes.length === revealSpans.length); }
function capMark() { const rv = document.querySelector('.now .rv'); if (rv) rv.classList.toggle('timed', capOk()); }
function revealAt(f, t) {
  if (capOk() && t != null) { for (let i = 0; i < revealSpans.length; i++) revealSpans[i].classList.toggle('on', capTimes[i] <= t + 0.03); capFollow(); return; }
  revealTo(f);
  capFollow();
}
/* 跟着滚 —— 长的一段念到屏幕下面去了，页面跟着往下走一点，
   让正在念的那个字停在屏幕四成高的地方；她自己在翻（滚轮 / 手指划）的六秒里不抢，抽屉、规矩那页开着也不动。 */
var followHold = 0, followAt = 0;
['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => { followHold = Date.now(); }, { passive: true }));
function capFollow() {
  const now = Date.now();
  if (!revealSpans || !revealSpans.length || document.hidden || now - followHold < 6000 || now - followAt < 900) return;
  if (($('rpd') && $('rpd').classList.contains('on')) || ($('sheet') && $('sheet').classList.contains('on'))) return;
  let last = null;
  for (let i = revealSpans.length - 1; i >= 0; i--) if (revealSpans[i].classList.contains('on')) { last = revealSpans[i]; break; }
  if (!last) return;
  const r = last.getBoundingClientRect(), vh = window.innerHeight;
  if (r.top > 0 && r.bottom > vh - 150) { followAt = now; window.scrollBy({ top: r.top - vh * 0.4, behavior: 'smooth' }); }
}
document.addEventListener('click', e => {
  const w = e.target && e.target.closest ? e.target.closest('.rv.timed .w') : null;
  if (!w || !capOk() || !cur || cur.kind !== 'say' || !cur.el) return;
  const i = revealSpans.indexOf(w);
  if (i < 0) return;
  capLastT = capTimes[i];
  revealAt(1, capTimes[i]);
  capSeek(cur.el, Math.max(0, capTimes[i]));
  if (paused) setPaused(false);
});
/* 念字那条（/api/tts/…）要是不支持断点续传（Range），浏览器只能从头放、跳不了 —— 头一次点字时把这一句整个拿下来换成本地的，就能随便跳 */
var capBlobs = [];
async function capSeek(a, t) {
  const can = a.seekable && a.seekable.length && a.seekable.end(a.seekable.length - 1) > 0;
  if (can || /^blob:/.test(a.currentSrc || a.src)) { try { a.currentTime = t; } catch (err) {} return; }
  let b = null;
  try { b = await fetch(a.currentSrc || a.src).then(r => r.ok ? r.blob() : null); } catch (err) {}
  if (!b || !cur || cur.el !== a) { if (!b) toast('这一句跳不过去'); return; }
  const go = !a.paused || !paused;
  const u = URL.createObjectURL(b); capBlobs.push(u); while (capBlobs.length > 6) URL.revokeObjectURL(capBlobs.shift());
  a.addEventListener('loadedmetadata', () => { try { a.currentTime = t; } catch (err) {} if (go) a.play().catch(() => {}); }, { once: true });
  a.src = u;
}
function fmtDay(t) { const d = new Date(t); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()]; }
function hm2(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
/* SEG:RADIO v16 —— 回放单起一个小标签：右边竖着一枚「回放」，点开右边一屉 —— 左边 故事 / 夜話 / 音樂 / 枕話 四个索引标签，右边 标题 + 时间（小一点）。
   标题是后端收台时让他起的，单子带 title；没有标题的那一晚（以前的、没收成的）用第一句话 / 放过的歌。 */
var rpKey = null;
function openReplay() {
  rpKey = ST[idx].key;
  rpDraw();
  $('rpd').classList.add('on'); $('veil').classList.add('on'); $('rptab').classList.add('hide');
}
function closeReplay() { $('rpd').classList.remove('on'); $('rptab').classList.remove('hide'); if (!$('sheet').classList.contains('on')) $('veil').classList.remove('on'); }
function rpTitle(n, key) {
  if (n.title) return n.title;
  if (n.first) return [...n.first].length > 24 ? [...n.first].slice(0, 24).join('') + '…' : n.first;
  if (n.songs && n.songs.length) return '♪ ' + n.songs.join('、');
  const s = ST.find(x => x.key === key);
  return (s ? s.name : '') + ' · 这一晚';
}
async function rpDraw() {
  const key = rpKey;
  $('rpSts').innerHTML = ST.map(x => `<button type="button" data-k="${x.key}" class="${x.key === key ? 'on' : ''}">${esc(x.name)}</button>`).join('');
  $('rpSts').querySelectorAll('button').forEach(b => { b.onclick = () => { rpKey = b.dataset.k; rpDraw(); }; });
  const box = $('rpList');
  box.innerHTML = '<div class="none">在翻……</div>';
  let r = null; try { r = await api('/api/radio/replay?station=' + key); } catch (e) {}
  if (rpKey !== key) return;
  const nights = (r && r.nights) || [];
  const live = sess && sess.replay ? '<a class="live" id="rpLive">回到直播 →</a>' : '';
  box.innerHTML = live + (!nights.length ? '<div class="none">这个台还没有能回放的。从现在起每一段都会记下来。</div>'
    : '<ol>' + nights.map(n => `<li data-id="${n.id}"><b>${esc(rpTitle(n, key))}</b><i>${fmtDay(n.from)} ${hm2(n.from)}–${hm2(n.to)} · ${n.n} 段${n.voiced < n.say ? ' · ' + n.voiced + '/' + n.say + ' 句有声' : ''}${n.back ? ' · 找回的' : ''}</i></li>`).join('') + '</ol>');
  if ($('rpLive')) $('rpLive').onclick = () => { closeReplay(); leave(); enter(idx); };
  box.querySelectorAll('li[data-id]').forEach(li => li.addEventListener('click', () => { closeReplay(); rpGo(key, +li.dataset.id); }));
}
/* 点的是别的台的一晚：先把卡座换到那个台（不开播），再放 */
function rpGo(key, id) {
  const i = ST.findIndex(x => x.key === key);
  if (i < 0) return;
  if (i !== idx) { cancelAnimationFrame(anim); show(i, i >= idx ? 1 : -1); pos = i; frame(); settle(i); }
  startReplay(ST[i], id);
}
async function startReplay(s, id) {
  let r = null;
  try { r = await api('/api/radio/replay?station=' + s.key + '&night=' + id); } catch (e) {}
  if (!r || !r.segs || ST[idx] !== s) { toast('这一晚没取到'); return; }
  started = true; $('bPlay').classList.remove('wait'); audioOn(); staticOn();
  leave();
  const q = [];
  for (const e of r.segs) {
    if (e.her) q.push({ type: 'her', text: e.her, at: hm2(e.t) });
    for (const p of e.parts || []) q.push(Object.assign({}, p, p.type === 'say' ? { text: p.show || '' } : {}));
  }
  sess = { key: s.key, st: s, queue: q, inflight: null, log: [], now: null, ended: false, waiting: [], ordered: true, showText: true, tracks: null, trackNo: null, err: '', replay: true, begun: true };
  setPaused(false);
  lcd('回放 · ' + fmtDay(r.night.from));
  toast('回放 ' + fmtDay(r.night.from) + ' 那一晚');
  drawNotes(); pump(sess);
}
$('rptab').addEventListener('click', openReplay); $('rpx').addEventListener('click', closeReplay); $('veil').addEventListener('click', closeReplay);

/* SEG:RADIO v9 —— 她 10-19：「改apk吗 做个播放栏出来 现在只是有声 没有权限」。
   App 壳（WebView）不认网页的 mediaSession，通知栏 / 锁屏上没有播放栏，耳机键也不归它。原生壳可以自己出一根（比如 Android 的 MediaSession 前台服务）：
   这边一有变化就 RadioNative.radioState(json) 报过去（在不在放、停没停、放的是什么、封面），收台 / 关页 RadioNative.radioStop()；
   栏上的键、耳机键按下去，壳在这一页派一个 native-radio 事件（play / pause / next / stop）。
   叠在宿主页面里放的时候电台在 iframe 里，壳那边会找到这个 iframe。旧壳没有这两个口，这一块什么都不做。
   枕話那台，锁屏上只写「深夜电台」，不露台名，也不露他在说什么。
   ★ 用 var / function：setPaused 在这一块前面就定义了，早早被调到也不会撞上「还没初始化」。 */
var ZN = (function () { try { var z = window.RadioNative || (window.parent !== window && window.parent.RadioNative); return z && typeof z.radioState === 'function' ? z : null; } catch (e) { return null; } })();
var nativeMeta = null, nativeLast = '', nativeOff = false;   /* nativeOff：她在栏上按了「关掉」，等她在页面上再按播放才重新出栏 */
function nativeSay() {
  if (!ZN || nativeOff) return;
  const s = ST[idx], m = nativeMeta || {};
  let o = { live: false };
  if (dockState().live) {
    const sub = m.artist && m.artist !== s.name ? m.artist + ' · ' + s.name : s.name + (s.hidden ? '' : ' · FM ' + s.f);
    o = s.key === 'pillow' ? { live: true, playing: !paused, title: '深夜电台', text: '', cover: '' }
      : { live: true, playing: !paused, title: m.title || s.name, text: sub, cover: m.cover || '' };
  }
  const k = JSON.stringify(o);
  if (k === nativeLast) return;
  nativeLast = k;
  try { if (o.live) ZN.radioState(k); else ZN.radioStop(); } catch (e) {}
}
function nativeCmd(c) {
  if (c === 'stop') { nativeOff = true; nativeLast = ''; if (!paused) $('bPlay').dispatchEvent(new MouseEvent('click')); return; }   /* 栏那边已经自己收了，别再报 */
  if (c === 'play') { nativeOff = false; if (paused) $('bPlay').dispatchEvent(new MouseEvent('click')); }
  else if (c === 'pause') { if (!paused) $('bPlay').dispatchEvent(new MouseEvent('click')); }
  else if (c === 'next') { if (cur && cur.kind === 'song') fadeSong(); else skipSeg(sess); }
  nativeSay();
}
if (ZN) {
  setInterval(nativeSay, 1000);
  window.addEventListener('native-radio', e => nativeCmd(e && e.detail));
  window.addEventListener('pagehide', () => { try { ZN.radioStop(); } catch (e) {} nativeLast = ''; });
}

/* 锁屏上显示正在放什么 */
function mediaMeta(title, artist, cover) {
  nativeMeta = { title, artist, cover }; nativeSay();   /* v9：也报给 App 壳的播放栏 */
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: title || '深夜电台', artist: artist || 'MIDNIGHT FM', album: '深夜电台 · ' + ST[idx].name, artwork: cover ? [{ src: String(cover).replace(/^http:\/\//, 'https://'), sizes: '300x300' }] : [] });
  } catch (e) {}
}
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => { if (paused) $('bPlay').dispatchEvent(new MouseEvent('click')); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!paused) $('bPlay').dispatchEvent(new MouseEvent('click')); });
    navigator.mediaSession.setActionHandler('nexttrack', () => { if (cur && cur.kind === 'song') fadeSong(); else skipSeg(sess); });   /* v5：锁屏 / 耳机的下一首：在放歌就跳歌，在说话就跳这一段 */
  } catch (e) {}
}

/* ═══════════════ 每一帧：带盘转、带子多少、电平 ═══════════════ */
let last = performance.now(), tick = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const playingSomething = !paused && cur;
  const target = playingSomething && !reduce ? (talking ? 2.4 : 1) * 360 / 24 : 0;
  speed += (target - speed) * Math.min(1, dt * 2.2);
  angle = (angle + speed * dt) % 360;
  hubs[idx] && hubs[idx].forEach(h => h.setAttribute('transform', `rotate(${-angle * 5} ${h.dataset.cx} 138)`));
  if ((tick++ & 7) === 0) {
    const pk = tapes[idx];
    pk.querySelector('.packL').setAttribute('r', (8.5 + (1 - progress) * 10).toFixed(2));
    pk.querySelector('.packR').setAttribute('r', (8.5 + progress * 10).toFixed(2));
    if (talking) $('recDot').setAttribute('opacity', $('recDot').getAttribute('opacity') === '1' ? .35 : 1);
    const amp = talking ? 1 : playingSomething ? .55 : 0;
    lbars.forEach(b => { const h = 1.5 + Math.random() * 9 * amp; b.setAttribute('y', 293 - h); b.setAttribute('height', h); });
  }
  requestAnimationFrame(loop);
}

/* ═══════════════ 开门 ═══════════════ */
if (!TOKEN && !BASE) $('hint').innerHTML = '<b>●</b> 没找到配置 —— 在 localStorage 的 midnight-fm-config 里填上 baseUrl / token（见 README）';
const want = (() => { try { return localStorage.getItem('radio-station'); } catch (e) { return null; } })();
let first = ST.findIndex(s => s.key === want);
if (first < 0 || ST[first].hidden) first = 2;   /* 默认音乐台：点开先放歌。藏起来的台不记 */
pos = first; idx = first;
show(first, 1); settle(first); frame(); enter(first);
setPaused(true);
requestAnimationFrame(loop);
})();
</script>
</body>
